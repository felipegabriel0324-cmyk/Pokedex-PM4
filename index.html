<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Pokedex</title>
		<link rel="stylesheet" href="css/header.css">
		<link rel="stylesheet" href="css/filtro.css">
		<link rel="stylesheet" href="css/cards.css">
		<script src="js/tipoStyle.js" defer></script>
		<script src="js/main.js" defer></script>
	</head>
	<body>
		<header>
			<div class="titulo">
				<img class="logo" src="images/logo.svg" alt="logo da pokedex">
				<div class="M-1">
					<h1 class="titulo-h1">POKEDEX</h1>
					<div class="bolas">
						<span class="bola-vermelha"></span>
						<span class="bola-amarela"></span>
						<span class="bola-verde"></span>
					</div>
				</div>
			</div>
				<input class="campo-busca" id="campo-busca" type="search" placeholder="pesquisa...">
			<div>
				<button id="irParaDex" class="minhapokedex">MINHA POKEDEX</button>
			</div>
		</header>
		<div id="tipo_script" class="filtro">
			<a class="text-type">TYPE:</a>
			<button class="tipo" data-tipo="all">ALL</button>
			<button class="tipo" data-tipo="favorites">FAVORITES</button>
			<button class="tipo" data-tipo="normal">NORMAL</button>
			<button class="tipo" data-tipo="fire">FIRE</button>
			<button class="tipo" data-tipo="water">WATER</button>
			<button class="tipo" data-tipo="grass">GRASS</button>
			<button class="tipo" data-tipo="flying">FLYING</button>
			<button class="tipo" data-tipo="fighting">FIGHTING</button>
			<button class="tipo" data-tipo="poison">POISON</button>
			<button class="tipo" data-tipo="electric">ELECTRIC</button>
			<button class="tipo" data-tipo="ground">GROUND</button>
			<button class="tipo" data-tipo="rock">ROCK</button>
			<button class="tipo" data-tipo="psychic">PSYCHIC</button>
			<button class="tipo" data-tipo="ice">ICE</button>
			<button class="tipo" data-tipo="bug">BUG</button>
			<button class="tipo" data-tipo="ghost">GHOST</button>
			<button class="tipo" data-tipo="steel">STEEL</button>
			<button class="tipo" data-tipo="dragon">DRAGON</button>
			<button class="tipo" data-tipo="dark">DARK</button>
			<button class="tipo" data-tipo="fairy">FAIRY</button>
		</div>
		<div class="tipo-separador">
		</div>
		<main class="card-box" id="pokedex-container">
		</main>
		<div class="selecao" id ="selecao_script">
		</div>
	</body>
</html>
